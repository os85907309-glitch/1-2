<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Exercise Recommender</title>
        <style>
            body {
                background-color: rgb(245, 245, 245);
                font-family: "Noto Sans KR", sans-serif;
            }

            h1 {
                color: rgb(50, 80, 160);
            }

            .wrap {
                width: 600px;
                margin: 30px auto;
                padding: 20px;
                background-color: white;
                border-radius: 10px;
            }

            img {
                width: 100%;
                border-radius: 10px;
            }

            .menu_box {
                margin-top: 20px;
                padding: 15px;
                background-color: rgb(235, 242, 255);
                border-radius: 10px;
            }

            .menu_box li {
                margin-bottom: 8px;
            }

            .event_box {
                margin-top: 20px;
                padding: 15px;
                background-color: rgb(255, 241, 210);
                border-radius: 10px;
            }

            input {
                width: 400px;
                height: 34px;
            }

            button {
                height: 38px;
                background-color: rgb(50, 80, 160);
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }

            button:hover {
                background-color: rgb(255, 120, 120);
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <h1>Our class recommendation & introduction</h1>
            <p>This is a simple web page for recommending and introducing exercises.</p>
            <!-- ./  -> 현재 해당 파일이 있는 폴더 -->
            <!-- ../ -> 현재 해당 파일이 있는 폴더 기준 한 단계 상위 폴더 -->
            <!-- /   -> 서버/웹서버/도메인의 루트 -->
            <img src="snackbar-hero.png" alt="exercise picture" />
            <div class="menu_box">
                <h2>populary exercises</h2>
                <ul id="menu_list"></ul>
            </div>
            <div class="menu_box">
                <h2>add exercise</h2>
                <input
                    id="input_snack"
                    type="text"
                    placeholder="recommend an exercise"
                />
                <button id="btn_add">add</button>
            </div>
            <div class="event_box">
                <h2>Today's Exercise</h2>
                <p id="event_result">Press the button to pick an exercise.</p>
                <p id="exercise_tip">Here's a tip for your exercise!</p>
                <button id="btn_event">Pick Exercise</button>
            </div>
        </div>
        <script>
            let exercises = ["jumping jacks", "push-ups", "squats"];

            const getRandomNumber = function (n) {
                // return Math.floor(Math.random() * (max - min + 1)) + min;
                return Math.floor(Math.random() * n);
            };

            document.getElementById("btn_event").onclick = function () {
                const num = getRandomNumber(exercises.length);
                document.getElementById("event_result").textContent =
                    `today's exercise ${exercises[num]}!`;
                    let tipMessage = "";
                const selectedExercise = exercises[num];
                if (selectedExercise === "Squats") {
                    tipMessage = "무릎이 발끝을 나가지 않도록 주의하고, 둔근에 자극을 느끼세요!";
                } else if (selectedExercise === "Push-ups") {
                    tipMessage = "엉덩이가 아래로 처지거나 위로 솟지 않도록 일직선을 유지하세요!";
                } else if (selectedExercise === "Jumping Jacks") {
                    tipMessage = "앞발의 뒤꿈치에 힘을 주며 수직으로 내려가세요!";
                } else {
                    tipMessage = "부상에 방지하기 위해 운동 전 충분한 스트레칭을 해주세요.";
                }
                // DOM을 통해 화면에 팁 반영하기
                document.getElementById("exercise_tip").textContent = tipMessage;
            };

            const renderexercise = function (exercise) {
                // 입력받은 운동 이름을 ul 내에 li로 추가한다.
                const li = document.createElement("li");
                li.textContent = exercise;
                document.getElementById("menu_list").appendChild(li);
            };

            const addExercise = function (exercise) {
                // 1. 입력받은 이름이 비어있으면 false,
                // 2. 그렇지 않으면 exercises 배열에 추가 후 true 반환
                if (exercise) {
                    exercises.push(exercise);
                    return true;
                }
                return false;
            };

            for (let i = 0; i < exercises.length; i++) {
                renderexercise(exercises[i]);
            }

            document.getElementById("btn_add").onclick = function () {
                // 1. 현재 input에 입력된 값을 가져온다.
                // 2. 값이 비었는지 검사한다.
                //  2-1. 비었다면 안내 후 종료
                // 3. 비어있지 않다면, 배열에 추가
                // 4. 목록에 렌더링
                const exercise = document.getElementById("input_snack").value;
                if (addExercise(exercise)) {
                    renderexercise(exercise);
                } else {
                    alert("Enter the exercise name!");
                };
            };
        </script>
    </body>
</html>
